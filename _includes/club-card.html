<a class="club-card" href="{{ club.url | relative_url }}">
  <div class="club-card-header">
    <div class="club-name">{{ club.name }}</div>
  </div>
  <div class="club-card-meta">
    <div class="club-days"><i data-lucide="calendar"></i><span>{{ club.days | join: ", " }}{% if club.frequency and club.frequency != "Weekly" %} · {{ club.frequency }}{% endif %}</span></div>
  </div>
  <i data-lucide="chevron-right" class="club-card-chevron"></i>
</a>
